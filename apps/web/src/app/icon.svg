<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="BeyondAgency">
  <rect width="64" height="64" rx="14" fill="#0B1620"/>
  <!-- Verification seal: concentric brass rings, the recurring motif of the
       "Warm Institution" direction (stamp, notarisation, record). -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#B8862B" stroke-width="1.25" opacity="0.55"/>
  <circle cx="32" cy="32" r="18.5" fill="none" stroke="#B8862B" stroke-width="0.75" opacity="0.35"/>
  <!-- House mark: roof + threshold, drawn open so it reads as a doorway. -->
  <path d="M20 33.5 L32 22.5 L44 33.5" fill="none" stroke="#DCBE78" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M24.5 33.5 V43 H39.5 V33.5" fill="none" stroke="#B8862B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32 43 V36.5" fill="none" stroke="#DCBE78" stroke-width="2.4" stroke-linecap="round"/>
</svg>
